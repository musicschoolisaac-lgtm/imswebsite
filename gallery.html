<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Gallery | Harmony Music School Rwanda</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      background-color: #f9f9f9;
    }

    nav {
      background: #222;
      color: #fff;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px 0;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #f8c102;
    }

    header {
      text-align: center;
      background: #fff;
      padding: 40px 20px;
    }

    header h1 {
      color: #b22222;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      background: #fff;
    }

    section {
      margin-bottom: 40px;
    }

    h2 {
      color: #b22222;
      margin-bottom: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #222;
      color: #fff;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="services.html">Services</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact Us</a>
  </nav>

  <header>
    <h1>Gallery</h1>
  </header>

  <main>
    <section>
      <h2>Our Work</h2>
      <div class="gallery">
        <img src="images/performance1.jpg" alt="Student performance at Harmony Music School">
        <img src="images/class1.jpg" alt="Guitar class in progress">
        <img src="images/traditional1.jpg" alt="Traditional Rwandan music session">
        <img src="images/studio1.jpg" alt="Recording session at Harmony Music School">
        <img src="images/performance2.jpg" alt="Choir performance">
        <img src="images/class2.jpg" alt="Piano lesson">
      </div>
    </section>
  </main>

  <footer>
    &copy; 2025 Harmony Music School Rwanda. All rights reserved.
  </footer>
</body>
</html>
