    <section>
      <form class="contact-form">
        <label>Name:<br>
          <input type="text" name="name" required>
        </label>
        <label>Email:<br>
          <input type="email" name="email" required>
        </label>
        <label>Message:<br>
          <textarea name="message" rows="5" required></textarea>
        </label>
        <button type="submit">Send Message</button>
      </form>
    </section>
